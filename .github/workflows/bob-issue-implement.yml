name: bob-issue-implement

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    # Only run when the label added is exactly 'bob-todo'
    if: github.event.label.name == 'bob-todo'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch for issue
        id: branch
        run: |
          BRANCH="bob-issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install Bob Shell
        run: |
          curl -fsSL https://bob.ibm.com/download/bobshell.sh > /tmp/bobshell.sh
          bash /tmp/bobshell.sh --pm npm
          echo "$(npm bin -g)" >> "$GITHUB_PATH"

      - name: Ask Bob to implement the issue
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOB_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          BOB_PROMPT="Implement the following GitHub issue in the domain/ folder.

          Issue title: ${ISSUE_TITLE}

          Issue description:
          ${ISSUE_BODY}

          Rules:
          - Only create or modify files under domain/.
          - Follow the existing code style and package structure.
          - Do not modify any files outside domain/.
          - Do not modify docs, workflows, or configuration files.
          - Do not add external dependencies."

          bob --accept-license --yolo -p "$BOB_PROMPT"

      - name: Commit and push implementation
        id: commit
        run: |
          git config user.name "bob-impl-bot"
          git config user.email "bob-impl-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add domain/
            git commit -m "feat: implement issue #${{ github.event.issue.number }} via Bob"
            git push origin HEAD:${{ steps.branch.outputs.name }}
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Bob made no changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "feat: ${{ github.event.issue.title }} (closes #${{ github.event.issue.number }})" \
            --body "Resolves #${{ github.event.issue.number }}

          This PR was automatically generated by Bob in response to a \`bob-todo\` labelled issue." \
            --base main \
            --head "${{ steps.branch.outputs.name }}"
