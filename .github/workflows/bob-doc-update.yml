name: bob-doc-update

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    # Skip if the PR is from a fork — GITHUB_TOKEN can't push to fork branches
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0   # Bob needs history to diff meaningfully

      - name: Ensure doc/diagram files exist
        run: |
          mkdir -p docs/diagrams

          if [[ ! -f docs/RELEASE_NOTES.md ]]; then
            echo "Creating docs/RELEASE_NOTES.md"
            cat > docs/RELEASE_NOTES.md << 'EOF'
          # Release Notes

          EOF
          fi

          if [[ ! -f docs/diagrams/class-diagram.md ]]; then
            echo "Creating docs/diagrams/class-diagram.md"
            cat > docs/diagrams/class-diagram.md << 'EOF'
          # Class Diagram

          ```mermaid
          classDiagram
              class Placeholder {
                  +note string
              }
          ```
          EOF
          fi

          if [[ ! -f docs/diagrams/workflow.md ]]; then
            echo "Creating docs/diagrams/workflow.md"
            cat > docs/diagrams/workflow.md << 'EOF'
          # Workflow

          ```mermaid
          flowchart TD
              A[Start] --> B[Placeholder]
          ```
          EOF
          fi

          if [[ ! -f docs/diagrams/sequence-diagram.md ]]; then
            echo "Creating docs/diagrams/sequence-diagram.md"
            cat > docs/diagrams/sequence-diagram.md << 'EOF'
          # Sequence Diagram

          ```mermaid
          sequenceDiagram
              participant Placeholder
          ```
          EOF
          fi

      - name: Install Bob Shell
        run: |
          curl -fsSL https://bob.ibm.com/download/bobshell.sh > /tmp/bobshell.sh
          bash /tmp/bobshell.sh --pm npm
          echo "$(npm bin -g)" >> "$GITHUB_PATH"

      - name: Ask Bob to update docs
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOB_API_KEY }}
        run: |
          bob --accept-license -p "
          Compare this branch against origin/${{ github.event.pull_request.base.ref }}.
          Based on the code changes:

          1. Update docs/RELEASE_NOTES.md — add a dated entry summarizing what changed in this PR.
          2. Update docs/diagrams/class-diagram.md — regenerate the mermaid classDiagram block to reflect
             any new/changed/removed classes, fields, or relationships in the domain/ folder only.
             If the file only contains a placeholder diagram, replace it entirely with a real one based
             on the current contents of domain/, not just this PR's diff. Keep surrounding prose, only
             replace the mermaid code fence.
          3. Update docs/diagrams/workflow.md — regenerate the mermaid flowchart block to reflect any
            changed control flow or process steps in the domain/ folder only. If the file only contains
            a placeholder diagram, replace it entirely with a real one based on the current contents of
            domain/.
          4. Update docs/diagrams/sequence-diagram.md — regenerate the mermaid sequenceDiagram block to
            show the interactions between domain/ classes (e.g. how callers interact with Warehouse,
            Location, and any other domain objects). If the file only contains a placeholder, replace it
            entirely with a real one based on the current contents of domain/.

         Only touch these four files. Only consider source files under domain/ when generating diagrams.
         Ignore everything outside domain/ (including .github/, workflows, scripts, or config files).
         Preserve existing structure and headings where content is unaffected.
         Do not invent classes or flows that aren't present in the domain/ code."

      - name: Commit and push doc updates
        run: |
          git config user.name "bob-docs-bot"
          git config user.email "bob-docs-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add docs/RELEASE_NOTES.md docs/diagrams/class-diagram.md docs/diagrams/workflow.md docs/diagrams/sequence-diagram.md
            git commit -m "docs: auto-update release notes and diagrams via Bob"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "No doc changes needed."
          fi
